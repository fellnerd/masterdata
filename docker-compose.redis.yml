# Optional self-hosted Redis, as an alternative to Upstash (cloud).
# Run together with the main compose file so both share one network/project:
#   docker-compose -f docker-compose.yml -f docker-compose.redis.yml up -d --build
# Then in .env: leave UPSTASH_REDIS_URL empty and set REDIS_HOST=redis
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mds-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
