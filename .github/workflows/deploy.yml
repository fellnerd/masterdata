name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy (clean restart)
    runs-on: [self-hosted, linux, masterdata]

    steps:
      - name: Pull latest main into deployment directory
        run: |
          cd /opt/masterdata
          git fetch origin main
          git reset --hard origin/main

      - name: Clean restart (down + build + up)
        run: |
          cd /opt/masterdata
          export GIT_SHA=$(git rev-parse --short HEAD)
          docker compose -f docker-compose.yml -f docker-compose.redis.yml down
          docker compose -f docker-compose.yml -f docker-compose.redis.yml up -d --build

      - name: Health check
        run: |
          cd /opt/masterdata
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3010/api/health > /dev/null; then
              echo "mds-app healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150s"
          docker compose -f docker-compose.yml -f docker-compose.redis.yml logs --tail 100
          exit 1
